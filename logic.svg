<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1020" width="760" height="1020" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">「尊厳は救護に優先する」規範の帰結(帰謬法)</title>
  <desc id="d">前提P1〜P5から、AEDを使わないことが義務になるという帰結O(¬A)を導き、その受け入れがたさから出発点P1を棄却する論理構造の図。</desc>

  <style>
    .bg    { fill: #ffffff; }
    .ink   { fill: #1f2328; }
    .mute  { fill: #59636e; }
    .amber { fill: #9a6700; }
    .red   { fill: #b42318; }
    .badge { fill: #eaeef2; }
    .card  { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .weak  { fill: #ffffff; stroke: #bf8700; stroke-width: 1.2; }
    .stripe{ fill: #bf8700; }
    .step  { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .concl { fill: #fff1f0; stroke: #b42318; stroke-width: 1.8; }
    .reduc { fill: #ffffff; stroke: #1f2328; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .arrow { stroke: #59636e; stroke-width: 1.8; fill: none; }
    .arrowhead { fill: #59636e; }
    .sans  { font-family: "Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif; }
    .math  { font-family: "Cambria Math","STIX Two Math","Times New Roman","DejaVu Serif","Noto Serif JP",serif; }
    .h1 { font-size: 22px; font-weight: 700; }
    .h2 { font-size: 14px; font-weight: 700; }
    .f  { font-size: 18px; }
    .fs { font-size: 15px; }
    .g  { font-size: 12.5px; }
    .tag{ font-size: 11px; font-weight: 700; }
    .id { font-size: 14px; font-weight: 700; }

    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .ink   { fill: #e6edf3; }
      .mute  { fill: #9198a1; }
      .amber { fill: #d4a72c; }
      .red   { fill: #ff7b72; }
      .badge { fill: #21262d; }
      .card  { fill: #0d1117; stroke: #30363d; }
      .weak  { fill: #0d1117; stroke: #d4a72c; }
      .stripe{ fill: #d4a72c; }
      .step  { fill: #161b22; stroke: #30363d; }
      .concl { fill: #2d1517; stroke: #ff7b72; }
      .reduc { fill: #0d1117; stroke: #e6edf3; }
      .arrow { stroke: #9198a1; }
      .arrowhead { fill: #9198a1; }
    }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <rect class="bg" width="760" height="1130"/>

  <!-- タイトル -->
  <text x="40" y="50" class="sans h1 ink">「尊厳は救護に優先する」規範の帰結</text>
  <text x="40" y="76" class="sans g mute">帰謬法による論理構造:前提 → 導出 → 結論 → 前提の棄却</text>

  <!-- 記号 -->
  <text x="40" y="108" class="sans g mute">A:AEDを使う(¬A:使わない)　Dw:女性の尊厳が守られる　Dm:男性の尊厳が守られる</text>
  <text x="40" y="128" class="sans g mute">X ≻ Y:XはYに優先する　X ≈ Y:XとYは同価値　O(…):〜すべきである</text>

  <!-- 前提 -->
  <text x="40" y="168" class="sans h2 ink">前提</text>

  <!-- P1 -->
  <rect x="40" y="180" width="680" height="54" rx="6" class="weak"/>
  <rect x="40" y="180" width="6" height="54" rx="3" class="stripe"/>
  <rect x="58" y="192" width="34" height="30" rx="5" class="badge"/>
  <text x="75" y="212" text-anchor="middle" class="sans id ink">P1</text>
  <text x="108" y="204" class="math f ink">尊厳 ≻ 救護</text>
  <text x="108" y="224" class="sans g mute">性被害観念のコンセプトクリープ (概念の漸動)</text>
  <text x="706" y="204" text-anchor="end" class="sans tag amber">現代日本が採用する社会規範</text>

  <!-- P2 -->
  <rect x="40" y="244" width="680" height="54" rx="6" class="weak"/>
  <rect x="40" y="244" width="6" height="54" rx="3" class="stripe"/>
  <rect x="58" y="256" width="34" height="30" rx="5" class="badge"/>
  <text x="75" y="276" text-anchor="middle" class="sans id ink">P2</text>
  <text x="108" y="268" class="math f ink">Dw ≈ Dm</text>
  <text x="108" y="288" class="sans g mute">尊厳の重さに男女差はなく同価値である</text>
  <text x="706" y="268" text-anchor="end" class="sans tag amber">否定は性差別にあたり許されない</text>

  <!-- P3 -->
  <rect x="40" y="308" width="680" height="54" rx="6" class="weak"/>
  <rect x="40" y="308" width="6" height="54" rx="3" class="stripe"/>
  <rect x="58" y="320" width="34" height="30" rx="5" class="badge"/>
  <text x="75" y="340" text-anchor="middle" class="sans id ink">P3</text>
  <text x="108" y="332" class="math f ink">A → ¬(Dw ∧ Dm)</text>
  <text x="108" y="352" class="sans g mute">AED使用は身体接触や脱衣を伴うため双方の尊厳が侵害される</text>
  <text x="706" y="332" text-anchor="end" class="sans tag amber">尊厳の保護失敗による論理的帰結</text>

  <!-- P4 -->
  <rect x="40" y="372" width="680" height="54" rx="6" class="card"/>
  <rect x="58" y="384" width="34" height="30" rx="5" class="badge"/>
  <text x="75" y="404" text-anchor="middle" class="sans id ink">P4</text>
  <text x="108" y="396" class="math f ink">¬A → (Dw ∧ Dm)</text>
  <text x="108" y="416" class="sans g mute">使わなければ、双方の尊厳が確実に守られる</text>

  <!-- P5 -->
  <rect x="40" y="436" width="680" height="54" rx="6" class="card"/>
  <rect x="58" y="448" width="34" height="30" rx="5" class="badge"/>
  <text x="75" y="468" text-anchor="middle" class="sans id ink">P5</text>
  <text x="108" y="460" class="sans fs ink">最上位の価値を満たす行為 a があるなら <tspan class="math f">O(a)</tspan></text>
  <text x="108" y="480" class="sans g mute">最上位の価値を満たせる行為があるなら、それを選ぶべき</text>

  <path d="M380,494 L380,526" class="arrow" marker-end="url(#ah)"/>

  <!-- 導出 -->
  <text x="40" y="552" class="sans h2 ink">導出</text>

  <rect x="40" y="564" width="680" height="54" rx="6" class="step"/>
  <text x="58" y="588" class="sans fs ink">① <tspan class="math f">P1 ∧ P2 ⊢ 最上位の価値 = Dw ∧ Dm</tspan></text>
  <text x="58" y="608" class="sans g mute">尊厳が救護に優先し、双方の尊厳が等価なので、両者を同時に守ることが最上位になる</text>

  <rect x="40" y="628" width="680" height="54" rx="6" class="step"/>
  <text x="58" y="652" class="sans fs ink">② P3:A は <tspan class="math f">Dw ∧ Dm</tspan> を満たさない　／　P4:¬A は満たす</text>
  <text x="58" y="672" class="sans g mute">救護は劣後するため、¬A によって失われるものは比較に入らない</text>

  <rect x="40" y="692" width="680" height="54" rx="6" class="step"/>
  <text x="58" y="716" class="sans fs ink">③ <tspan class="math f">P5 ⊢ O(¬A)</tspan></text>
  <text x="58" y="736" class="sans g mute">最上位の価値を満たせる行為は ¬A だけなので、¬A が義務になる</text>

  <path d="M380,746 L380,780" class="arrow" marker-end="url(#ah)"/>

  <!-- 結論 -->
  <rect x="40" y="790" width="680" height="76" rx="8" class="concl"/>
  <text x="380" y="822" text-anchor="middle" class="math f red" style="font-size:22px; font-weight:700;">∴ O(¬A)</text>
  <text x="380" y="848" text-anchor="middle" class="sans fs ink">侵害の危険がある場面では、AEDを使わないことが義務になる</text>

  <path d="M380,866 L380,896" class="arrow" marker-end="url(#ah)"/>

  <!-- 帰謬法 -->
  <rect x="40" y="906" width="680" height="76" rx="8" class="reduc"/>
  <text x="58" y="932" class="sans h2 ink">帰謬法</text>
  <text x="140" y="932" class="math fs ink">(P1 ∧ P2 ∧ P3 ∧ P4 ∧ P5) → O(¬A)　かつ　¬O(¬A)　∴　¬(P1 ∧ … ∧ P5)</text>
  <text x="58" y="962" class="sans g mute">結論が受け入れがたいなら前提のどれかが誤り。本稿が棄却するのは出発点 P1「尊厳は救護に優先する」。</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
